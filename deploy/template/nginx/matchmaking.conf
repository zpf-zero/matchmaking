server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /data/matchmaking/web;
    index index.html;

    # 上传限制后端是 5MB，这里留一点余量给 multipart 开销
    client_max_body_size 6m;

    access_log /var/log/nginx/matchmaking.access.log;
    error_log  /var/log/nginx/matchmaking.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # H5 是单页应用，刷新子路由要回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物带内容哈希，可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不能缓存，否则前端更新后用户还拿着旧的 assets 引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # 头像和相册直接由 nginx 读磁盘，比回源到 Go 快；
    # 文件不在（比如刚上传还没落到这台机器）再回退给后端
    location /uploads/ {
        root /data/matchmaking/server;
        try_files $uri @backend;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location @backend {
        proxy_pass http://127.0.0.1:8066;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8066;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8066;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 后端心跳间隔小于这个值，长连接才不会被 nginx 掐掉
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8066/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
