# HTTPS 站点配置（证书由运维以文件形式提供，见 deploy/README.md 第六节）
#
# 启用条件（deploy.sh 自动判断，无需人工切换）：
#   /data/matchmaking/nginx/ssl/fullchain.pem  存在且非空
#   /data/matchmaking/nginx/ssl/privkey.pem    存在且非空
# 两个文件都在时用本文件；缺任意一个则自动退回 matchmaking.conf（纯 HTTP），
# 避免证书没传就先 reload 导致 nginx 起不来。
#
# 80 端口只保留 /health 和 HTTP→HTTPS 跳转：
#   - /health 不跳转，供 deploy.sh 自检和外部探活使用（跳转会让探活拿到 301）
#   - 其余全部 301 到 https

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    access_log /var/log/nginx/matchmaking.access.log;
    error_log  /var/log/nginx/matchmaking.error.log;

    # 探活与部署自检走明文，不做跳转
    location = /health {
        proxy_pass http://127.0.0.1:8066/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 用 "listen ... http2" 而不是 nginx 1.25+ 的 "http2 on"：
    # Ubuntu 20.04/22.04 自带的是 nginx 1.18/1.20，不认后者，nginx -t 会直接失败
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate     /data/matchmaking/nginx/ssl/fullchain.pem;
    ssl_certificate_key /data/matchmaking/nginx/ssl/privkey.pem;

    # 微信小程序要求 TLS 1.2 及以上；关掉老协议和弱加密套件
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 证书一年一换，换完 reload 即可；HSTS 先设半年，确认稳定后再加到一年
    add_header Strict-Transport-Security "max-age=15552000" always;

    root /data/matchmaking/web;
    index index.html;

    # 上传限制后端是 5MB，这里留一点余量给 multipart 开销
    client_max_body_size 6m;

    access_log /var/log/nginx/matchmaking.access.log;
    error_log  /var/log/nginx/matchmaking.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # H5 是单页应用，刷新子路由要回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物带内容哈希，可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不能缓存，否则前端更新后用户还拿着旧的 assets 引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # 头像和相册直接由 nginx 读磁盘，比回源到 Go 快；
    # 文件不在（比如刚上传还没落到这台机器）再回退给后端
    location /uploads/ {
        root /data/matchmaking/server;
        try_files $uri @backend;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location @backend {
        proxy_pass http://127.0.0.1:8066;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8066;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8066;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 后端心跳间隔小于这个值，长连接才不会被 nginx 掐掉
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8066/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
