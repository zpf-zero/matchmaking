server:
  # 8080 在部署机上被 Docker 容器占用，后端改用 8066（nginx 同步转发到 8066）
  port: 8066
  mode: release

mysql:
  # 2026-10-31 拆分：生产用 marry_link，本地开发用 marry_link_dev（config.dev.yaml）。
  # 注意：deploy/build.ps1 会把这个文件打进部署包并覆盖服务器上的配置，
  # 所以这里改了，服务器上的配置才会在下次部署时保持一致。
  host: 101.35.245.54
  port: 3306
  user: marry_link
  password: XSxJGYmyBdFMLiBc
  database: marry_link

jwt:
  # 生产密钥：2026-10-26 由默认值换成 36 字节随机串，与开发配置不同。
  # 更换后历史 token 全部失效，用户需要重新登录一次，这是预期行为。
  # 注意：改动此值必须同步重启服务；若将来多实例部署，各实例必须是同一个值。
  secret: "_HNy47Ip9-lNN_CSt51pLEyQeA2de7o1AlNHgj1B-RoWz5UG"
  expire_days: 7

wechat:
  # 凭证已到位（2026-10-25），生产切真实模式：
  #   - 小程序登录走真实 jscode2session
  #   - 手机号走 getPhoneNumber 真实解密（0.03 元/次，1000 次免费额度）
  #   - 文本内容安全走真实 msg_sec_check
  # 注意：微信后台「用户隐私保护指引」须先配置好，否则真机 getPhoneNumber /
  #   chooseAvatar 调用会失败（docs/07 第 6 项）
  mock: false
  app_id: "wx925d8686db1553ce"
  app_secret: "3646aa96e4fe0128416f7a0ef1575989"

sms:
  # 【待申请】短信签名 + 模板 —— docs/07-待申请事项清单.md 第 7.1 节
  #   H5 手机号登录必须走真实短信通道；未配置前 H5 登录不可用。
  #   即使 mock 暂为 true，release 模式也只把验证码写服务端日志，绝不经接口回传。
  mock: true
  provider: "aliyun"
  access_key_id: ""
  access_key_secret: ""
  sign_name: ""            # 短信签名，如「良缘天合」
  template_code: ""        # 模板变量名必须是 code，如 {"code":"123456"}
  region_id: "cn-hangzhou"
  code_ttl_seconds: 300
  resend_seconds: 60
  daily_limit: 5
  ip_hourly_limit: 20

# 【已完成 2026-10-30】域名 + ICP 备案 + HTTPS
#   站点 https://liangyuan.bythedu.com（Let's Encrypt 证书，自动续期），
#   上传文件也走该域名，避免小程序里出现 http 外链（微信会拦截）。
upload:
  dir: "/data/matchmaking/server/uploads"
  base_url: "https://liangyuan.bythedu.com/uploads"
  max_size_mb: 5

# 功能远程开关。只改这里 + 重启后端即可生效，前端不提供任何开关界面
features:
  # 私聊聊天。false = 关闭：会话/消息接口一律拒绝，前端隐藏消息列表与所有聊天入口
  # （App 内的「谁喜欢我 / 我喜欢的 / 谁看过我」等互动入口不受影响）
  private_chat: false

admin:
  # 白名单内的 openid 登录时自动置为超级管理员（role=4）
  # mock 模式下，openid 就是前端传的 code
  # 首次登录会自动建号、提权为超管，并把「待完善」状态扶正为正常，直接进后台
  super_admin_openids:
    - "admin"
    - "mock_admin"
